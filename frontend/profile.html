<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12a862">
  <title>Profile — PlanetWatch</title>
  <link rel="icon" type="image/jpeg" href="img/clean-africa-2.jpg">
  <link rel="apple-touch-icon" href="img/app/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
</head>
<body data-page="profile" data-auth="required" data-location="required">
  <script src="js/layout.js"></script>

<div class="container">
  <div class="section" style="padding-top: 40px;">
    <div class="form-card profile-card">
      <div class="profile-head">
        <button type="button" class="avatar" id="avatarBtn" aria-label="Add a profile photo">
          <img id="avatarImg" alt="" hidden>
          <span class="avatar-initials" id="avatarInitials"></span>
          <span class="avatar-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 8.5A2 2 0 0 1 6 6.5h1.6l1.4-2h6l1.4 2H18a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12.5" r="3.2" stroke="currentColor" stroke-width="1.8"/></svg>
          </span>
        </button>
        <input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp" hidden>
        <div class="profile-id">
          <h2 id="profileName">Your Profile</h2>
          <p id="memberSince"></p>
          <button type="button" class="avatar-remove" id="removePhotoBtn" hidden>Remove photo</button>
        </div>
        <button type="button" class="btn btn-ghost btn-edit" id="editBtn">
          <svg class="icon-edit" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M13.5 6.5l4 4" stroke="currentColor" stroke-width="1.8"/></svg>
          <svg class="icon-cancel" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
          <span>Edit profile</span>
        </button>
      </div>
      <p class="form-sub profile-sub">These details are used to auto-fill your reports.</p>

      <div class="alert alert-success" id="savedBox" hidden>
        <img src="img/icons/success.png" alt="">
        <div><strong>Profile saved.</strong></div>
      </div>
      <div class="alert alert-error" id="errorBox" hidden>
        <img src="img/icons/warning.png" alt="">
        <div>
          <strong>Couldn't save</strong>
          <p data-error-text></p>
        </div>
      </div>

      <form id="profileForm" class="profile-form is-readonly">
        <div class="field">
          <label for="name">First name</label>
          <input type="text" id="name" name="name" required readonly autocomplete="given-name">
        </div>
        <div class="field">
          <label for="surname">Surname</label>
          <input type="text" id="surname" name="surname" required readonly autocomplete="family-name">
        </div>
        <div class="field">
          <label for="address">Address</label>
          <input type="text" id="address" name="address" readonly autocomplete="street-address">
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <input type="text" id="phone" name="phone" required readonly inputmode="tel" autocomplete="tel">
        </div>

        <!-- Only shown once something has actually been changed. -->
        <div class="profile-confirm" id="confirmBlock" hidden>
          <div class="field">
            <label for="currentPassword" id="passwordLabel">Current password</label>
            <div class="password-input">
              <input type="password" id="currentPassword" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
              <button type="button" class="password-toggle" data-password-toggle aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/></svg></button>
            </div>
            <span class="field-hint" id="passwordHint">Enter your password to confirm these changes.</span>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
        </div>
      </form>

      <button type="button" class="btn btn-ghost btn-block profile-logout" id="logoutBtn">Log Out</button>
    </div>
  </div>
</div>

  <script src="js/location-guard.js"></script>
  <script src="js/pages/profile.js"></script>
</body>
</html>
