<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12a862">
  <title>Profile — PlanetWatch</title>
  <link rel="icon" type="image/jpeg" href="img/clean-africa-2.jpg">
  <link rel="apple-touch-icon" href="img/app/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
</head>
<body data-page="profile" data-auth="required" data-location="required">
  <script src="js/layout.js"></script>

<div class="container">
  <div class="section" style="padding-top: 40px;">
    <div class="form-card" style="max-width: 440px; margin: 0 auto;">
      <h2>Your Profile</h2>
      <p class="form-sub">These details are used to auto-fill your reports &mdash; update them any time.</p>

      <div class="alert alert-success" id="savedBox" hidden>
        <img src="img/icons/success.png" alt="">
        <div><strong>Profile saved.</strong></div>
      </div>
      <div class="alert alert-error" id="errorBox" hidden>
        <img src="img/icons/warning.png" alt="">
        <div>
          <strong>Couldn't save</strong>
          <p data-error-text></p>
        </div>
      </div>

      <form id="profileForm">
        <div class="field">
          <label for="name">First name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label for="surname">Surname</label>
          <input type="text" id="surname" name="surname" required>
        </div>
        <div class="field">
          <label for="address">Address</label>
          <input type="text" id="address" name="address">
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <input type="text" id="phone" name="phone" required inputmode="tel">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
      </form>

      <button type="button" class="btn btn-ghost btn-block" style="margin-top: 14px;" id="logoutBtn">Log Out</button>
    </div>
  </div>
</div>

  <script src="js/location-guard.js"></script>
  <script>
    (function () {
      const form = document.getElementById('profileForm');
      const savedBox = document.getElementById('savedBox');
      const errorBox = document.getElementById('errorBox');
      const submit = form.querySelector('button[type="submit"]');

      PW.ready.then((citizen) => {
        if (!citizen) return;
        ['name', 'surname', 'address', 'phone'].forEach((key) => { form.elements[key].value = citizen[key] || ''; });
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        savedBox.hidden = true;
        errorBox.hidden = true;
        submit.disabled = true;
        submit.classList.add('is-loading');
        try {
          const data = await PW.request('/api/me', { method: 'PUT', body: Object.fromEntries(new FormData(form)) });
          PW.setCitizen(data.citizen);
          savedBox.hidden = false;
        } catch (error) {
          errorBox.querySelector('[data-error-text]').textContent = error.message;
          errorBox.hidden = false;
        } finally {
          submit.disabled = false;
          submit.classList.remove('is-loading');
        }
      });

      document.getElementById('logoutBtn').addEventListener('click', () => PW.logout());
    })();
  </script>
</body>
</html>
