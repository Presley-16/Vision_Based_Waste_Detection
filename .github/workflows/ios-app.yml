# Builds the PlanetWatch iOS app (.ipa) on GitHub's macOS runners, so no Mac is needed.
#
# The .ipa is unsigned. Sideloadly / AltStore sign it with the installer's own
# Apple ID while installing it over USB (see mobile/README.md).
#
# Run it from GitHub → Actions → "iOS app" → Run workflow, then download the
# "PlanetWatch-ipa" artifact and save PlanetWatch.ipa into mobile/dist/.
name: iOS app

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Backend address the app talks to (use the https address from `run.py --tunnel` or your server)"
        required: true

jobs:
  build-ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Capacitor
        run: npm ci

      - name: Bundle the website into the app
        run: node scripts/sync-web.mjs "${{ inputs.server_url }}" && npx cap sync ios

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload dist
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry dist/PlanetWatch.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PlanetWatch-ipa
          path: mobile/dist/PlanetWatch.ipa
