<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Illegal Dumping Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    #map { height: 85vh; width: 100%; }
    body { font-family: sans-serif; margin: 1rem; }
  </style>
</head>
<body>
  <h1>Illegal Dumping Hotspots</h1>
  <p><a href="/">Home</a> | <a href="/report">Report Dumping</a></p>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([-17.8252, 31.0335], 12); // Harare

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
    }).addTo(map);

    fetch('/api/reports')
      .then((response) => response.json())
      .then((geojson) => {
        L.geoJSON(geojson, {
          onEachFeature: (feature, layer) => {
            const props = feature.properties;
            const wasteTypes = props.waste_types.length ? props.waste_types.join(', ') : 'unclassified';
            layer.bindPopup(
              `<strong>Report #${props.id}</strong><br>` +
              `Waste: ${wasteTypes}<br>` +
              `Status: ${props.status}<br>` +
              `Submitted: ${props.submitted_at}`
            );
          },
        }).addTo(map);
      });
  </script>
</body>
</html>
