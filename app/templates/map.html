{% extends "base.html" %}

{% block title %}Live Dumping Map — PlanetWatch{% endblock %}

{% block content %}
<div class="container map-shell">
  <div class="map-header">
    <div>
      <span class="eyebrow"><span class="dot"></span> Live hotspot map</span>
      <h1 style="margin: 10px 0 0; font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em;">
        {{ report_count }} report{{ 's' if report_count != 1 else '' }} tracked
      </h1>
    </div>
    <div class="map-legend">
      <span><span class="swatch" style="background:#f6b93b;"></span> Pending</span>
      <span><span class="swatch" style="background:#2563eb;"></span> Reviewed</span>
      <span><span class="swatch" style="background:#12a862;"></span> Resolved</span>
    </div>
  </div>

  <div class="map-card">
    <iframe title="Illegal dumping hotspot map" srcdoc="{{ map_html }}"></iframe>
  </div>
</div>
{% endblock %}
