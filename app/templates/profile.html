{% extends "base.html" %}

{% block title %}Profile — PlanetWatch{% endblock %}

{% block content %}
<div class="container">
  <div class="section" style="padding-top: 40px;">
    <div class="form-card" style="max-width: 440px; margin: 0 auto;">
      <h2>Your Profile</h2>
      <p class="form-sub">These details are used to auto-fill your reports &mdash; update them any time.</p>

      <form action="{{ url_for('login') }}" method="post">
        <div class="field">
          <label for="name">First name</label>
          <input type="text" id="name" name="name" required value="{{ citizen.name }}">
        </div>
        <div class="field">
          <label for="surname">Surname</label>
          <input type="text" id="surname" name="surname" required value="{{ citizen.surname }}">
        </div>
        <div class="field">
          <label for="address">Address</label>
          <input type="text" id="address" name="address" value="{{ citizen.address or '' }}">
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <input type="text" id="phone" name="phone" required value="{{ citizen.phone }}">
        </div>
        <input type="hidden" name="next" value="{{ url_for('profile') }}">
        <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
      </form>

      <a href="{{ url_for('logout') }}" class="btn btn-ghost btn-block" style="margin-top: 14px;">Log Out</a>
    </div>
  </div>
</div>
{% endblock %}
