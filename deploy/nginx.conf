# setup.sh replaces __DOMAIN__ and installs this as /etc/nginx/sites-available/planetwatch.
# certbot then adds the https (443) block and the http -> https redirect.
server {
    listen 80;
    server_name __DOMAIN__;

    # Matches the app's MAX_CONTENT_LENGTH (several phone photos per report).
    client_max_body_size 80M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Checking several photos on the CPU can take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
